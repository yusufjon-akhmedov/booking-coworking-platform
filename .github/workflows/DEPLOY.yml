name: Deploy to Contabo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-booking-coworking-platform
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw -B test
          else
            mvn -B test
          fi

  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.CONTABO_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key

          printf '%s\n' "${{ secrets.CONTABO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/contabo_key \
              -p "${{ secrets.CONTABO_PORT }}" \
              "${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}" << 'EOF'
            set -e

            echo "Go to project directory..."
            cd ~/github-projects/booking-coworking-platform

            echo "Pull latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Build and restart Docker containers..."
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "Docker status:"
            docker compose ps

            echo "Waiting for Swagger endpoint..."

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8082/swagger-ui/index.html >/dev/null; then
                echo "Application is ready."
                break
              fi

              echo "Application is not ready yet. Attempt $i/30..."
              sleep 10
            done
          
          if [ "$i" -eq 30 ]; then
            echo "Application did not become ready in time."
            docker compose logs --tail=200 app
            exit 1
          fi
         done

            echo "Final API check..."
            curl -I http://127.0.0.1:8082/swagger-ui/index.html || true

            echo "Deploy finished successfully."
          EOF