name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  package:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -B -DskipTests package

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: target/*.jar

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare env
        run: cp .env.example .env

      - name: Replace placeholder secrets for CI
        run: |
          sed -i 's|POSTGRES_PASSWORD=replace-with-a-strong-db-password|POSTGRES_PASSWORD=postgres|g' .env
          sed -i 's|MAIL_USERNAME=replace-with-mail-username|MAIL_USERNAME=ci@example.com|g' .env
          sed -i 's|MAIL_PASSWORD=replace-with-mail-password|MAIL_PASSWORD=dummy-password|g' .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for application health
        run: |
          for i in {1..36}; do
            if curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null; then
              echo "Readiness endpoint is healthy"
              exit 0
            fi

            if curl -fsS http://localhost:8082/actuator/health >/dev/null; then
              echo "Health endpoint is healthy"
              exit 0
            fi

            sleep 5
          done

          echo "Application did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown containers
        if: always()
        run: docker compose down -v