spring:
  application:
    name: coworking-booking

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/coworking_booking}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:your_email@gmail.com}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:your_app_password}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8082}

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:Y2hhbmdlLW1lLWxvY2FsLW9ubHktdGhpcy1pcy1hLWRldmVsb3BtZW50LWp3dC1zZWNyZXQtY2hhbmdlLWJlZm9yZS1wcm9kdWN0aW9uLXVzZS0yMDI2}}
    access-token-expiration: ${APP_JWT_ACCESS_TOKEN_EXPIRATION:${JWT_ACCESS_TOKEN_EXPIRATION:86400000}}
    refresh-token-expiration: ${APP_JWT_REFRESH_TOKEN_EXPIRATION:${JWT_REFRESH_TOKEN_EXPIRATION:604800000}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
