# monitoring/prometheus.yml
# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scrape configuration for the Coworking Booking Platform
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s   # Pull metrics every 15 seconds
  evaluation_interval: 15s   # Evaluate alert rules every 15 seconds
  scrape_timeout:      10s

  # These labels are attached to every time series scraped from this Prometheus
  external_labels:
    environment: local

# ── Alert rules (optional) ────────────────────────────────────────────────────
# rule_files:
#   - /etc/prometheus/alerts/*.yml

# ── Scrape targets ───────────────────────────────────────────────────────────
scrape_configs:

  # 1. Coworking Booking API  ←  our Spring Boot app
  - job_name: 'coworking-booking-api'
    metrics_path: '/actuator/prometheus'   # Spring Boot exposes metrics here
    static_configs:
      - targets: ['app:8082']              # Docker service name + port
        labels:
          service: 'coworking-api'

  # 2. Prometheus itself (always useful for meta-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 3. (Optional) PostgreSQL exporter — add later if needed
  # - job_name: 'postgres-exporter'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']