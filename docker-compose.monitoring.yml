services:
  Prometheus:
    image: prom/prometheus:v2.53.0
    container_name: coworking-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - coworking-prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

    depends_on:
      - app

    restart: unless-stopped



  Grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: coworking-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # Change in production!
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - # Auto-provision Prometheus datasource (no UI click needed)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - # Auto-load our dashboard JSON
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - # Persistent storage (user settings, additional dashboards)
      - coworking-grafana-data:/var/lib/grafana

    depends_on:
      - prometheus
    restart: unless-stopped

